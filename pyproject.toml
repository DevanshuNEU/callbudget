[project]
name = "callbudget"
version = "0.1.0"
description = "Pharmacy medication search as active sensing under a calling budget"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Devanshu Chicholikar" }]

# Core deps: data + prediction, the observation store, and the MCP surface.
# Voice deps are an optional [voice] extra so the base environment stays light.
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "duckdb>=1.0",   # the observation log (the moat): Parquet store + windowed feature SQL
    "fastmcp>=2.0",  # the MCP surface is a core deliverable, not voice-specific
    "optuna>=3.6",   # the auto-research loop's optimizer: seedable TPE + constraint support
    "rich>=13.7",    # product-grade terminal rendering for the demo + research report
    # Note: started with xgboost, switched to sklearn HistGradientBoosting to
    # avoid the macOS OpenMP (libomp) system dependency. Same algorithm family,
    # native NaN handling, zero extra system deps.
]

[project.scripts]
callbudget = "callbudget.cli:main"

[project.optional-dependencies]
# Voice-only deps (the live audio loop). Install with: uv sync --extra voice
voice = [
    "pipecat-ai",
    "deepgram-sdk",
    "cartesia",
    "anthropic",
    "pyaudio",  # local mic/speaker transport; needs the portaudio system lib (brew install portaudio)
]
# Web UI (FastAPI + a static page over the engine). Install with: uv sync --extra web
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Live agentic layer (verify locally, never CI): an mcp-use agent that drives the
# MCP surface, plus instructor for schema-validated LLM extraction. Heavyweight
# (pulls LangChain) so it stays an extra. Install with: uv sync --extra agent
agent = [
    "mcp-use>=1.0",
    "langchain-anthropic>=0.2",
    "instructor>=1.0",
    "anthropic",
]

[dependency-groups]
# Dev tools: matplotlib (the hero chart) + the web stack (so the UI runs and its
# TestClient test passes on a plain `uv sync`). Not runtime deps of the library.
dev = [
    "pytest>=8", "ruff>=0.6", "pyright>=1.1", "matplotlib>=3.8",
    "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
    "hypothesis>=6.100",  # property-based tests for the ECF math invariants
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callbudget"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
